# Fichier commun (spec §6.3) : services, réseaux, volumes. Aucun port n'est publié ici.
#   dev  : docker compose -f docker-compose.yml -f docker-compose.dev.yml …
#   prod : docker compose -f docker-compose.yml -f docker-compose.prod.yml …
name: vps-sentinel

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      SENTINEL_DB_OWNER_PASSWORD: ${SENTINEL_DB_OWNER_PASSWORD:?SENTINEL_DB_OWNER_PASSWORD manquant dans .env}
      SENTINEL_DB_APP_PASSWORD: ${SENTINEL_DB_APP_PASSWORD:?SENTINEL_DB_APP_PASSWORD manquant dans .env}
    volumes:
      # Depuis PostgreSQL 18, l'image range PGDATA sous /var/lib/postgresql/18/docker : on monte le dossier parent.
      - pgdata:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # En TCP : le serveur temporaire de l'initialisation n'écoute que sur la socket Unix.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - data

networks:
  data:

volumes:
  pgdata:
