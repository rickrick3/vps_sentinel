# Intégration continue (spec §13.10) : contrôles du dépôt, backend et frontend en parallèle, puis E2E sur la pile complète.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Contrôles du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fins de ligne, bit exécutable, fichiers d'hygiène, fichiers sensibles (spec §13.9).
      - run: bash scripts/check-repo.sh
      # Ports publiés par les combinaisons dev et prod (spec §6.3).
      - run: bash scripts/check-compose-ports.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers démarre PostgreSQL 18 sur le Docker du runner.
      - name: ./mvnw verify
        working-directory: services/core-api
        run: ./mvnw -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Types d'API à jour avec le contrat OpenAPI
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts

  e2e:
    name: E2E
    needs: [checks, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: cp .env.example .env
      - run: bash scripts/gen-dev-secrets.sh
      - name: Dépendances et Chromium de Playwright
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium
      # Pile dev vierge, scénarios E2E-1 et E2E-2, contrôles du gateway (spec §13.8).
      - run: bash scripts/e2e.sh
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
