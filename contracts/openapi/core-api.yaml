openapi: 3.1.0
info:
  title: VPS Sentinel Core API
  version: "1"
servers:
- url: /
security:
- bearer: []
paths:
  /api/v1/audit-logs:
    get:
      operationId: auditLogsList
      parameters:
      - in: query
        name: actorUserId
        required: false
        schema:
          type: string
      - in: query
        name: action
        required: false
        schema:
          type: string
      - in: query
        name: targetType
        required: false
        schema:
          type: string
      - in: query
        name: targetId
        required: false
        schema:
          type: string
      - description: "Inclus. Instant ISO-8601, par exemple 2026-11-02T10:30:00Z."
        in: query
        name: from
        required: false
        schema:
          type: string
      - description: "Exclu. Instant ISO-8601, postérieur à from."
        in: query
        name: to
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: sort
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseAuditLogResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Erreur au format Problem Details (RFC 9457)
      tags:
      - audit-logs-controller
