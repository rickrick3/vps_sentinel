components:
  schemas:
    AuditLogResponse:
      type: object
      properties:
        action:
          type: string
        actorEmail:
          type: string
        actorType:
          type: string
        actorUserId:
          type: string
          format: uuid
        correlationId:
          type: string
        details:
          type: object
          additionalProperties: {}
        id:
          type: string
          format: uuid
        ip:
          type: string
        occurredAt:
          type: string
          format: date-time
        targetId:
          type: string
          format: uuid
        targetType:
          type: string
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
        tokenType:
          type: string
        user:
          $ref: "#/components/schemas/MeResponse"
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 1024
          minLength: 0
        newPassword:
          type: string
          maxLength: 1024
          minLength: 0
      required:
      - currentPassword
      - newPassword
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        fullName:
          type: string
          maxLength: 120
          minLength: 0
        role:
          type: string
          minLength: 1
          pattern: ^(SUPER_ADMIN|INFRA_ADMIN|DEVOPS|DEVELOPER|VIEWER)$
      required:
      - email
      - fullName
      - role
    CreatedUserResponse:
      type: object
      properties:
        temporaryPassword:
          type: string
        temporaryPasswordExpiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserResponse"
    DeploymentRequest:
      type: object
      properties:
        role:
          type: string
          maxLength: 50
          minLength: 0
          pattern: "^[A-Za-z0-9][A-Za-z0-9 ._-]*$"
        serverId:
          type: string
          format: uuid
      required:
      - serverId
    DeploymentResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        environmentId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        role:
          type: string
        serverAdminStatus:
          type: string
        serverId:
          type: string
          format: uuid
        serverName:
          type: string
    DomainRequest:
      type: object
      properties:
        hostname:
          type: string
          minLength: 1
        isPrimary:
          type: boolean
      required:
      - hostname
    DomainResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        hostname:
          type: string
        id:
          type: string
          format: uuid
        isPrimary:
          type: boolean
    EnvironmentDetail:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        deployments:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentResponse"
        domains:
          type: array
          items:
            $ref: "#/components/schemas/DomainResponse"
        id:
          type: string
          format: uuid
        kind:
          type: string
        name:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    EnvironmentRequest:
      type: object
      properties:
        kind:
          type: string
          pattern: ^(PRODUCTION|STAGING|DEVELOPMENT|OTHER)$
        name:
          type: string
          maxLength: 50
          minLength: 0
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        version:
          type: integer
          format: int64
          description: "Version lue, pour le verrouillage optimiste : obligatoire\
            \ en PUT, refusée en POST."
          minimum: 0
      required:
      - kind
      - name
    EnvironmentResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        kind:
          type: string
        name:
          type: string
        projectId:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    HostedEnvironmentResponse:
      type: object
      properties:
        deploymentId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        environmentName:
          type: string
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        role:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 1024
