# Fichiers du build Vite (spec §6.1), joints seulement par le gateway, qui ajoute les en-têtes de sécurité.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Fichiers à empreinte (assets/<nom>-<hash>.js) : leur contenu ne change jamais.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routes du SPA : une adresse inconnue renvoie index.html, toujours revalidé.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
