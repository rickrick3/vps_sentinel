# En-têtes transmis à l'amont (spec §6.4, §8.10) : écrasés, jamais complétés depuis la requête du client.
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";

# Les en-têtes de sécurité de la réponse sont fixés par le gateway : ceux de l'amont sont retirés pour ne pas les doubler.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
