# Gateway de production (spec §6.4) : terminaison TLS ; le port 80 ne sert que le défi ACME et la redirection.
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/sentinel/common.conf;

    server {
        listen 80;
        server_name _;

        # Renouvellement Let's Encrypt en mode webroot (spec §15).
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        include /etc/nginx/sentinel/routes.conf;
    }
}
