# Réglages communs au gateway de dev et de prod (contexte http).
include /etc/nginx/mime.types;
default_type application/octet-stream;
sendfile on;
server_tokens off;
client_max_body_size 1m;

# Journal d'accès avec l'identifiant de requête ; jamais le corps, Authorization ni Cookie (spec §6.4).
log_format sentinel '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time '
                    '"$http_user_agent" request_id=$request_id';
access_log /var/log/nginx/access.log sentinel;

# Noms des services résolus à l'exécution par le DNS de Docker : un conteneur redémarré (nouvelle IP) reste joignable.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream core_api {
    zone core_api 64k;
    server core-api:8080 resolve;
}
upstream frontend {
    zone frontend 64k;
    server frontend:80 resolve;
}

# Strict-Transport-Security en HTTPS seulement (security-headers.conf).
map $scheme $hsts {
    https   "max-age=31536000";
    default "";
}

# Limitation grossière par IP (spec §6.4) ; la limitation fine est dans l'API (spec §8.4).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_status 429;

# Sonde du healthcheck Compose : boucle locale du conteneur, port jamais publié.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
}
