# Gateway de développement (spec §6.4) : HTTP seul, publié sur 127.0.0.1:8088 par docker-compose.dev.yml.
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/sentinel/common.conf;

    server {
        listen 80;
        server_name _;
        include /etc/nginx/sentinel/routes.conf;
    }
}
