# Routes du gateway (spec §6.4), communes au serveur HTTP de dev et au serveur HTTPS de prod (contexte server).
# Ni /v3/api-docs ni les autres endpoints Actuator ne sont routés vers l'API : ils tombent sur le frontend.
error_page 429 = @rate_limited;

location = /api/v1/auth/login {
    limit_req zone=login burst=5 nodelay;
    include /etc/nginx/sentinel/security-headers.conf;
    include /etc/nginx/sentinel/proxy-headers.conf;
    proxy_pass http://core_api;
}

location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    include /etc/nginx/sentinel/security-headers.conf;
    include /etc/nginx/sentinel/proxy-headers.conf;
    proxy_pass http://core_api;
}

location /api/ {
    include /etc/nginx/sentinel/security-headers.conf;
    include /etc/nginx/sentinel/proxy-headers.conf;
    proxy_pass http://core_api;
}

location = /actuator/health {
    include /etc/nginx/sentinel/security-headers.conf;
    include /etc/nginx/sentinel/proxy-headers.conf;
    proxy_pass http://core_api;
}

location / {
    include /etc/nginx/sentinel/security-headers.conf;
    include /etc/nginx/sentinel/proxy-headers.conf;
    proxy_pass http://frontend;
}

# Dépassement de débit : Problem Details, comme les erreurs de l'API (spec §11).
location @rate_limited {
    default_type application/problem+json;
    include /etc/nginx/sentinel/security-headers.conf;
    return 429 '{"type":"urn:sentinel:problem:rate-limited","title":"Trop de requêtes","status":429}';
}
