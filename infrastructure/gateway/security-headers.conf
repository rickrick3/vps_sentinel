# En-têtes de sécurité (spec §6.4), inclus dans CHAQUE location : un add_header dans un bloc location annule ceux
# hérités du bloc server. « always » : aussi sur les réponses d'erreur (401, 403, 429…).
# 'unsafe-inline' est limité aux styles (balises <style> de Mantine) ; les scripts restent limités à 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HTTPS seulement ($hsts est vide en HTTP : l'en-tête n'est alors pas envoyé).
add_header Strict-Transport-Security $hsts always;
