# Surcharge dev (spec §6.3). Ports publiés sur la boucle locale uniquement, jamais sur le réseau local.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  # Pile complète sur http://localhost:8088, en HTTP.
  gateway:
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./infrastructure/gateway:/etc/nginx/sentinel:ro
    command: ["nginx", "-c", "/etc/nginx/sentinel/nginx.dev.conf", "-g", "daemon off;"]

# Générés par scripts/gen-dev-secrets.sh ; dossier ignoré par git.
secrets:
  jwt_private:
    file: ./infrastructure/secrets/dev/jwt-private.pem
  jwt_public:
    file: ./infrastructure/secrets/dev/jwt-public.pem
  hmac_key:
    file: ./infrastructure/secrets/dev/hmac.key
